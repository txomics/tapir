project:
  type: book
  output-dir: docs

quarto-required: ">= 1.11.0"

execute:
  freeze: auto

book:
  title: "TAPIR: Transcript analysis pipelines in R"
  subtitle: "A field guide to long-read RNA-seq analysis"
  author: "Michael Love, Justin Landis, Beatriz Campillo, and Rachel Sharp"
  date: "11/18/2026"
  repo-url: https://github.com/txomics/tapir
  chapters:
    - index.qmd
    - part: "Foundations"                                            # NEW: parts group the sidebar
      chapters:
        - intro.qmd
    - part: "Workflows"
      chapters:
        - eda.qmd
        - testing.qmd
        - annotate-plyxp-splicelogic.qmd
        - post-dtu.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo

editor: visual
